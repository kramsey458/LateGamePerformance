# Late Game Performance settings. Restart the game after editing.
# Keys marked (simulation) must be identical on every multiplayer peer.

# (simulation) Reuse each district's sorted hauling job list instead of rebuilding it per hauler decision.
HaulCache = true

# (simulation) Drop everything cached every N ticks. 1 = nothing survives a tick (safest, default).
# 0 = never; rely only on change tracking (fastest, but an unknown modded input could go stale).
HaulCacheFlushEveryTicks = 1

# Recompute the vanilla list on every request and compare. Slower than vanilla; for testing only.
# Mismatches are logged and the vanilla list is used.
HaulCacheVerify = false

# (simulation) After every navigation tick, build every cached route map that is not built, on worker threads,
# instead of one by one on the main thread as they are next needed. Must be the same on every multiplayer peer.
RouteMaps = true

# Rebuild in the background: the tick carries on and the main thread only ever waits for the one route map it is
# about to use. false = the main thread waits for the whole batch. Does not affect results, so
# it may differ between multiplayer peers.
RouteMapsBackground = true

# Fewer unbuilt route maps than this (a new building or two) are built directly on the main thread instead of on
# workers. They are still built straight away. Does not affect results, so it may differ between peers.
RouteMapsMinFields = 4

# Worker threads for route map rebuilds. 0 = automatic (up to 7). Does not affect results, so it may differ
# between multiplayer peers.
RouteMapsWorkers = 0

# One stats line showing how the main thread's time splits between simulation and everything else (rendering,
# animation, UI), plus ticks and frames per second and the longest frame. One hook per frame; negligible cost.
Timing = true

# One line per save (autosave, manual save, save on exit) showing how long each stage of it took. Measurement
# only: the hooks run only during a save and do not change how or when the game saves. Also lets the Timing line
# report saves on their own instead of as its longest frame.
SaveTiming = true

# When "Record per-component timings" is ticked in the mod's settings page (Mods > Late Game Performance), or
# the game is launched with -metrics: write the game's own per-component tick timings to
# Documents\Timberborn\LateGamePerformance every N ticks. 0 = never, which also disables the menu setting.
MetricsEveryTicks = 3000

# Log whether incremental garbage collection is on, at startup.
GcReport = true

# Time route map (flow field) rebuilds and need selection. Adds overhead to hot code; for investigation only.
Diagnostics = false

# Write a stats line to Player.log every N ticks (0 = never). 1000 ticks is 10 minutes at 1x speed.
StatsEveryTicks = 1000
