# Late Game Performance settings. Restart the game after editing.
#
# Nothing in this file changes what the game simulates, so players in a multiplayer game may have different
# values. What does decide that (the hauling cache, route maps, the tree and plant search) is not a setting: it is
# the same for everyone who runs the same version of the mod. Older files may still contain HaulCache,
# HaulCacheFlushEveryTicks, RouteMaps or YielderSearch; they are ignored.

# Recompute the vanilla list on every request and compare. Slower than vanilla; for testing only.
# Mismatches are logged and the vanilla list is used.
HaulCacheVerify = false

# Route maps are rebuilt in the background: the tick carries on and the main thread only ever waits for the one route map it is
# about to use. false = the main thread waits for the whole batch. Does not affect results, so
# it may differ between multiplayer peers.
RouteMapsBackground = true

# Fewer unbuilt route maps than this (a new building or two) are built directly on the main thread instead of on
# workers. They are still built straight away. Does not affect results, so it may differ between peers.
RouteMapsMinFields = 4

# Worker threads for route map rebuilds. 0 = automatic (up to 7). Does not affect results, so it may differ
# between multiplayer peers.
RouteMapsWorkers = 0

# Plant water check: read every water level again on the main thread and compare with what the worker threads
# read. For testing. Mismatches are logged and the main thread's value is used.
PlantWaterVerify = false

# District resource counts: let the game count as well and compare. For testing. Mismatches are logged and the
# game's numbers are used.
DistrictCountsVerify = false

# Water map copy: let the game copy the water map every tick as well and compare, byte for byte, with the copy
# made on a worker thread. For testing. Mismatches are logged and the game's copy is used.
WaterMapCopyVerify = false

# Soil moisture and contamination: walk every soil cell the game's way as well and compare which cells were
# updated. For testing. Mismatches are logged.
SoilScansVerify = false

# Water rendering: switch water tiles only when they change and leave out texture uploads the graphics card
# already has. Rendering only, never the simulation, so it may differ between multiplayer peers. Set to false if
# water ever looks wrong (and please report it).
WaterRendering = true

# Autosaves and saves from the menu: the game thread takes the snapshot, and turning it into JSON, compressing it
# and writing the file happen on a worker thread while the game carries on. The file is written under a
# temporary name and renamed when it is complete. false = the game saves entirely by itself, as without the mod.
# Does not touch the simulation, so it may differ between multiplayer peers.
BackgroundSave = true

# Tree and plant search: run the game's own search as well and compare. Slower than no mod; for testing. Mismatches are logged and the
# game's result is used.
YielderSearchVerify = false

# One stats line showing how the main thread's time splits between simulation and everything else (rendering,
# animation, UI), plus ticks and frames per second and the longest frame. One hook per frame; negligible cost.
Timing = true

# One line per save (autosave, manual save, save on exit) showing how long each stage of it took. Measurement
# only: the hooks run only during a save and do not change how or when the game saves. Also lets the Timing line
# report saves on their own instead of as its longest frame.
SaveTiming = true

# A profiling tool. true = switch on the game's own per-component tick timers and write their report to
# Documents\Timberborn\LateGamePerformance every MetricsEveryTicks ticks. The timers slow the game a little, so
# set it back to false when done. (Up to 0.4.9 this was a box on the settings page. Launching the game with
# -metrics has the same effect.)
RecordTimings = false

# How often the report above is written. 0 = never, which also disables RecordTimings.
MetricsEveryTicks = 3000

# Log whether incremental garbage collection is on, at startup.
GcReport = true

# Collect garbage right after each save's main-thread part, in the frame that is long anyway, instead of in a
# separate frame a second later. Memory only.
CollectAfterSave = true

# Place the audio listener only when the camera moved, while it is still gliding, and every tenth frame otherwise,
# instead of casting rays every frame. Sound only.
SoundListener = true

# Rebuild the status alert lists every fourth frame and refresh the selected entity's panel every second frame.
# User interface only.
UiThrottle = true

# After a long frame (an autosave, a garbage collection) the game runs the simulation for all the time that frame
# took, so one hitch becomes a second of stutter. true limits what one frame catches up to twice the ordinary frame
# time; the rest is left out. Pacing only: which ticks run, and in what order, is unchanged.
LimitCatchUp = true

# Time route map (flow field) rebuilds, need selection, walker path finding and the game's A* searches. Adds
# overhead to hot code; for investigation only.
Diagnostics = false

# Write a stats line to Player.log every N ticks (0 = never). 1000 ticks is 10 minutes at 1x speed.
StatsEveryTicks = 1000
